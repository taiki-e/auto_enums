name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tidy:
    uses: taiki-e/github-actions/.github/workflows/tidy.yml@dc24bff2366e8ddeea5e0e4168df3d6f4b93f596 # 2026.8.8
    permissions:
      security-events: write # for github/codeql-action/*
  test:
    needs: tidy
    uses: taiki-e/github-actions/.github/workflows/rust-test.yml@e6a1170cbd07eb898017958967912976fce18f2d # 2026.7.3
    with:
      doctest-nightly-only: true
      build-args: --depth 2 --features unstable

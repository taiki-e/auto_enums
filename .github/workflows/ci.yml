name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  schedule:
    - cron: '0 2 * * 5'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  tidy:
    uses: taiki-e/github-actions/.github/workflows/tidy.yml@a2bc8ad241bd3c7fa2ba3239d7dca7a032a17095 # 2026.11.22
    permissions:
      security-events: write # for github/codeql-action/*
  test:
    needs: tidy
    uses: taiki-e/github-actions/.github/workflows/rust-test.yml@a2bc8ad241bd3c7fa2ba3239d7dca7a032a17095 # 2026.11.22
    with:
      doctest-nightly-only: true
      build-args: --depth 2 --features unstable
